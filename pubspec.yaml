name: agustinita_creator
description: Agustinita Creator — diseño de agendas y post-its personalizados con IA (Agustinita Papelería).
publish_to: "none"
version: 0.6.0+9

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  pdf: ^3.11.1
  file_selector: ^1.0.3
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  intl: ^0.19.0
  share_plus: ^10.0.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/fonts/Poppins-Regular.ttf
    - assets/fonts/Poppins-Medium.ttf
    - assets/fonts/Poppins-Bold.ttf
    - assets/fonts/Pacifico-Regular.ttf
    - assets/fonts/LilitaOne-Regular.ttf
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
